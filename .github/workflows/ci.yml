name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install mypy types-requests
      - name: Ruff
        run: ruff check app/api/routes/metrics.py app/api/routes/studies.py app/infra/config.py app/imaging/dicom_io.py tests/test_dicom_io.py
      - name: Mypy (scoped)
        run: python -m mypy app/infra/config.py app/api/schemas.py app/models_hub/constraints.py --ignore-missing-imports
      - name: Pytest
        run: python -m pytest tests -q --tb=line

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend
        run: npm ci
      - name: Install backend (for OpenAPI export)
        working-directory: backend
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Typecheck + build
        run: npm run build
      - name: OpenAPI types drift check
        run: npm run generate:api:check

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke e2e
        working-directory: frontend
        env:
          VOXFLOW_TASK_FAKE_LATENCY_SCALE: "0.05"
          VOXFLOW_TASK_MAX_CONCURRENCY: "2"
        run: npx playwright test e2e/smoke.spec.ts --reporter=line
