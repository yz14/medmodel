services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      VOXFLOW_TASK_FAKE_LATENCY_SCALE: "1.0"
      VOXFLOW_TASK_MAX_CONCURRENCY: "2"
      VOXFLOW_CORS_ORIGINS: '["http://localhost","http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

